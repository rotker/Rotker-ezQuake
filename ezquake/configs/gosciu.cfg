////////////////////////////////////////////////////////////////////////////////////////////////////


unaliasall
alias .msg.status.report             "say_team $\{&cfffgosc} $colored_armor/{%h} [{%l}] $powerups {%e}"
alias .msg.status.report.cells       "say_team $\{&cfffgosc} $colored_armor/{%h} {&cbf0c}{&cfff:$cells} [{%l}] $powerups {%e}"
alias .msg.status.report.lg          "say_team $\{&cfffgosc} $colored_armor/{%h} {&cbf0lg}{&cfff:$cells} [{%l}] $powerups {%e}"
alias .msg.status.report.lg.rox      "say_team $\{&cfffgosc} $colored_armor/{%h} {&cbf0lg}{&cfff:$cells} [{%l}] $powerups {%e}"
alias .msg.status.report.rl          "say_team $\{&cfffgosc} $colored_armor/{%h} {&cbf0rl}{&cfff:$rockets} [{%l}] $powerups {%e}"
alias .msg.status.report.rl.cells    "say_team $\{&cfffgosc} $colored_armor/{%h} {&cbf0rl}{&cfff:$rockets} [{%l}] $powerups {%e}"
alias .msg.status.report.rl.lg       "say_team $\{&cfffgosc} $colored_armor/{%h} {&cbf0rl}{&cfff:$rockets} {&cbf0lg}{&cfff:$cells} [{%l}] $powerups {%e}"
alias .msg.status.report.rox         "say_team $\{&cfffgosc} $colored_armor/{%h} {&cbf0r}{&cfff:$rockets} [{%l}] $powerups {%e}"
alias .msg.status.report.rox.cells   "say_team $\{&cfffgosc} $colored_armor/{%h} {&cbf0r}{&cfff:$rockets} {&cbf0c}{&cfff:$cells} [{%l}] $powerups {%e}"
alias __on_enter                     "if $__download == 1 then cmd dl .; set __download 0; set __demomark 0"
alias __on_matchend                  "if $__demomark == 1 set __download 1 else set __download 0"
alias __status_report                "if ('$bestweapon' = '$tp_name_lg') then __status_report_lg_check else if ('$bestweapon' = '$tp_name_rl') then __status_report_rl_check else __status_report_normal"
alias __status_report_lg_check       "if ('$rockets' > '0') then .msg.status.report.lg.rox else .msg.status.report.lg"
alias __status_report_normal         "if ('$cells' > '0') then __status_report_normal_check else if ('$rockets' > '0') then .msg.status.report.rox else .msg.status.report"
alias __status_report_normal_check   "if ('$rockets' > '0') then .msg.status.report.rox.cells else .msg.status.report.cells"
alias __status_report_rl_check       "if ('$tp_name_lg' isin '$weapons') then .msg.status.report.rl.lg else if ('$cells' > '0') then .msg.status.report.rl.cells else .msg.status.report.rl"
alias infoset                        "cmd info ev 25"
alias on_connect                     "authenticate"
alias on_enter                       "__on_enter"
alias on_matchbreak                  "set __download 0; set __demomark 0"
alias on_matchend                    "__on_matchend"
alias +showe1m2pack                  "cl_model_bobbing 1"
alias -showe1m2pack                  "cl_model_bobbing 0"

